name: API Tests

on:
  push:
    branches: [ main, cinema ]
  pull_request:
    branches: [ main, cinema ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Set up Docker Compose
        run: |
          docker compose --version
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d
          # Wait for services to be ready
          echo "Waiting for services to be ready..."
          sleep 120
      
      # Установка зависимостей для тестов
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman and dependencies
        run: |
          npm install -g newman
          npm install newman-reporter-htmlextra --save-dev

      # Запуск API-тестов
      - name: Run API tests
        run: |
          newman run \
            ./tests/postman/collection.json \
            -e ./tests/postman/environment.json \
            -r htmlextra \
            --reporter-htmlextra-export ./test-reports/newman-report.html \
            --bail  # прерывать сборку при ошибках тестов


      # Сохранение отчёта о тестах
      - name: Upload test report
        uses: actions/upload-artifact@v4 
        if: always()
        with:
          name: api-test-report
          path: ./test-reports/
          retention-days: 7
      