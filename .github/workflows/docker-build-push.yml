name: Docker Build and Push

on:
  push:
    branches: 
      - main
      - cinema  
    paths:
      - 'src/**'
      - 'tests/postman/**'  # тесты Newman
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches:
      - main
      - cinema
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  MONOLITH_IMAGE_NAME: ${{ github.repository }}/monolith
  MOVIES_SERVICE_IMAGE_NAME: ${{ github.repository }}/movies-service
  EVENTS_SERVICE_IMAGE_NAME: ${{ github.repository }}/events-service
  PROXY_SERVICE_IMAGE_NAME: ${{ github.repository }}/proxy-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Monolith
        id: meta-monolith
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Monolith Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          push: true
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for Movies Service
        id: meta-movies
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Movies Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          push: true
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Сборка и публикация образа proxy-service
      - name: Build and push proxy-service
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          file: ./src/microservices/proxy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/proxy-service:latest
            ghcr.io/${{ github.repository }}/proxy-service:${{ github.sha }}

      # Сборка и публикация образа events-service
      - name: Build and push events-service
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          file: ./src/microservices/events/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/events-service:latest
            ghcr.io/${{ github.repository }}/events-service:${{ github.sha }}

     # Установка зависимостей для тестов
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Newman and dependencies
        run: |
          npm install -g newman
          npm install newman-reporter-htmlextra --save-dev

      # Запуск API-тестов
      - name: Run API tests
        run: |
          newman run \
            ./tests/postman/collection.json \
            -e ./tests/postman/environment.json \
            -r htmlextra \
            --reporter-htmlextra-export ./test-reports/newman-report.html \
            --bail  # прерывать сборку при ошибках тестов


      # Сохранение отчёта о тестах
      - name: Upload test report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: api-test-report
          path: ./test-reports/
          retention-days: 7
      