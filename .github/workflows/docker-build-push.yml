name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/microservices/proxy/**'
      - 'src/microservices/events/**'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  PROXY_IMAGE: ${{ github.repository }}/proxy-service
  EVENTS_IMAGE: ${{ github.repository }}/events-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Сборка и тестирование events-service
      - name: Build Events Service
        working-directory: src/microservices/events
        run: |
          docker build -t events-test .

      - name: Test Events API
        working-directory: src/microservices/events
        run: |
          docker run -d --name events-container -p 8082:8082 events-test
          sleep 10
          curl -f http://localhost:8082/health || exit 1
          curl -f http://localhost:8082/api/events || exit 1
          docker stop events-container

      # Публикация образов в GHCR
      - name: Push Proxy Image
        uses: docker/build-push-action@v4
        with:
          context: src/microservices/proxy
          file: src/microservices/proxy/Dockerfile
          tags: ${{ env.REGISTRY }}/${{ env.PROXY_IMAGE }}:latest
          push: true

      - name: Push Events Image
        uses: docker/build-push-action@v4
        with:
          context: src/microservices/events
          file: src/microservices/events/Dockerfile
          tags: ${{ env.REGISTRY }}/${{ env.EVENTS_IMAGE }}:latest
          push: true

          # Сборка и тестирование proxy-service
      - name: Build Proxy Service
        working-directory: src/microservices/proxy
        run: |
          docker build -t proxy-test .

      - name: Test Proxy API
        working-directory: src/microservices/proxy
        run: |
          # Запуск контейнера в фоновом режиме
          docker run -d --name proxy-container -p 8080:8080 proxy-test
          # Ожидание старта сервиса
          sleep 10
          # Запуск API-тестов (пример для curl)
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8000/api/movies || exit 1
          # Остановка контейнера
          docker stop proxy-container

      