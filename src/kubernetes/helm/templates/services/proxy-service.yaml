{{- if .Values.proxyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  labels:
    app: proxy-service
spec:
  replicas: {{ .Values.proxyService.replicas }}
  selector:
    matchLabels:
      app: proxy-service
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      imagePullSecrets:
        - name: dockerconfigjson
      containers:
        - name: proxy-service
          image: "ghcr.io/bugaevamg-mgkoroly/cinemaabyss_sprint2/proxy-service:667b091b992fb996540a31d344b335268d150f73"
          imagePullPolicy: {{ .Values.proxyService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.proxyService.service.targetPort }}
          envFrom:
            - configMapRef:
                name: cinemaabyss-config
          resources:
            {{- toYaml .Values.proxyService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
spec:
  type: {{ .Values.proxyService.service.type }}
  selector:
    app: proxy-service
  ports:
    - port: {{ .Values.proxyService.service.port }}
      targetPort: {{ .Values.proxyService.service.targetPort }}
{{- end }}