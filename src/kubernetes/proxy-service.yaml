apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proxy-service
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      containers:
      - name: proxy-service
        image: ghcr.io/your-repo/cinemaabyss:proxy-main
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: MONOLITH_URL
          value: http://monolith-svc:8080
        - name: MOVIES_SERVICE_URL
          value: http://movies-svc:8081
        - name: EVENTS_SERVICE_URL
          value: http://event-service-svc:80
        - name: GRADUAL_MIGRATION
          value: "true"
        - name: MOVIES_MIGRATION_PERCENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MOVIES_MIGRATION_PERCENT
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service-svc
spec:
  selector:
    app: proxy-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
